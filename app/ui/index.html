<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mad Midi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">Mad&nbsp;Midi</div>
      <div id="entryList"></div>
      <div id="addDevicePicker" class="add-picker" hidden></div>
      <div class="sidebar-add">
        <button id="addDeviceBtn">+ Device</button>
        <button id="addDraftBtn">+ Draft</button>
      </div>
    </aside>

    <div id="workspace">
      <header id="topbar">
        <div id="entryHeader"></div>
      </header>

      <div id="mainEmpty" hidden>
        Add a device or draft in the sidebar to start editing a config.
      </div>

      <div id="main">
        <div id="centerCol">
          <div id="viewTabs"></div>

          <div id="tableView" class="view active">
            <table id="pinTable">
              <thead>
                <tr>
                  <th>Pin (~ = PWM)</th><th>Role</th><th>Ch</th><th>Note/CC</th>
                  <th>In min</th><th>In max</th><th>Out min</th><th>Out max</th>
                  <th>Inv</th><th>Tgl</th><th></th>
                </tr>
              </thead>
              <tbody id="pinTableBody"></tbody>
            </table>
          </div>

          <div id="boardView" class="view">
            <div id="boardGrid"></div>
          </div>

          <div id="sequencerView" class="view">
            <div id="sequencerSettings"></div>
            <div id="sequencerSteps"></div>
          </div>

          <div id="droneView" class="view">
            <div id="droneSettings"></div>
            <div id="droneSegments"></div>
          </div>

          <div id="fxRackView" class="view">
            <div id="fxRackSettings"></div>
            <div id="fxRackSegments"></div>
          </div>

          <div id="joystickView" class="view">
            <div id="joystickSettings"></div>
          </div>

          <div id="testView" class="view">
            <div id="testSettings"></div>
            <div id="testGrid"></div>
          </div>
        </div>

        <aside id="editorPanel">
          <h3 id="editorTitle">Select a pin</h3>
          <div id="editorFields"></div>
        </aside>
      </div>

      <footer id="monitor">
        <div id="monitorHeader">
          <span>MIDI Monitor</span>
          <button id="clearMonitorBtn">Clear</button>
        </div>
        <div id="monitorLog"></div>
      </footer>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
